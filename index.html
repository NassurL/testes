<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Checklist de Crise</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 min-h-screen p-6 text-slate-100">

<main class="max-w-6xl mx-auto space-y-6">

  <!-- Cabeçalho -->
  <div class="bg-slate-800 rounded-xl p-6 border-l-8 border-red-600 shadow-xl">
  <a href="gerador_manu 1.html"
class="inline-block bg-indigo-600 hover:bg-indigo-700 transition-all duration-200 px-5 py-3 rounded-xl font-bold shadow-lg border border-indigo-400">
🛠️ Ir para Cadastro de Manutenção
</a>
    <h1 class="text-3xl font-extrabold text-red-500">🚨 Checklist de Crise - NOC By7</h1>
    <p class="text-sm text-slate-400">Report operacional · WhatsApp</p>
  </div>

  <!-- Identificação -->
  <div class="bg-slate-800 rounded-xl p-6 shadow-lg border-t-4 border-yellow-500">
    <h2 class="text-xl font-bold mb-4">Identificação do Report</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <select id="reportTipo" onchange="toggleParcial()" class="campo">
        <option value="Inicial">Report Inicial</option>
        <option value="Parcial">Report Parcial</option>
        <option value="Finalização">Report Finalização</option>
      </select>

      <input id="reportParcial" type="number" min="1"
        placeholder="Número da Parcial"
        class="campo hidden">

      <input id="cliente" placeholder="Cliente" class="campo">
      <select id="escalado" class="campo">
        <option value="Cliente">Escalado por Cliente</option>
        <option value="By Seven">Escalado por By Seven</option>
      </select>

      <input id="motivo" placeholder="Motivo" class="campo">
      <input id="chamado" placeholder="Chamado" class="campo">

      <!-- Datas -->
      <div class="col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label">Início da Crise</label>
          <input id="inicio" type="datetime-local" class="campo">
        </div>
        <div>
          <label class="label">Término da Crise</label>
          <div class="flex gap-2">
            <input id="termino" type="datetime-local" class="campo">
            <button type="button" onclick="setNA()"
              class="h-[42px] px-3 rounded bg-slate-600 text-sm shrink-0">
              N/A
            </button>
          </div>
        </div>
      </div>

      <input id="sala" placeholder="Sala de Crise" class="campo">
      <input id="by7" placeholder="Envolvido By Seven" class="campo">
      <input id="clienteEnv" placeholder="Envolvidos Cliente" class="campo">

      <input id="moderador" placeholder="Moderador" class="campo">
      <input id="acionamento" placeholder="Acionamento via" class="campo">

    </div>
  </div>

  <!-- Evolução -->
  <div class="bg-slate-800 rounded-xl p-6 shadow-lg border-t-4 border-blue-500">
    <h2 class="text-xl font-bold mb-2">
      🕒 Evolução do Incidente (atualizações a cada 1h)
    </h2>
    <textarea id="statuslog" rows="6" class="campo resize-none"
      placeholder="14:00 - Instabilidade detectada&#10;15:00 - Operadora acionada"></textarea>
  </div>

  <!-- Texto -->
  <div class="bg-slate-800 rounded-xl p-6 shadow-lg border-t-4 border-green-500">
    <h2 class="text-xl font-bold mb-3">📄 Texto do Report</h2>

    <textarea id="reportTexto" rows="14" readonly
      class="campo font-mono text-sm resize-none"></textarea>

    <button onclick="copiarTexto()"
      class="mt-3 w-full bg-green-600 hover:bg-green-700 p-3 rounded-xl font-bold">
      📋 Copiar texto
    </button>

    <button onclick="resetarCampos()"
      class="mt-2 w-full bg-red-600 hover:bg-red-700 p-3 rounded-xl font-bold">
      🔄 Resetar
    </button>
  </div>

</main>

<style>
.campo {
  width: 100%;
  height: 42px;
  padding: 0.5rem;
  border-radius: 0.5rem;
  background: #334155;
  color: white;
}
.campo::placeholder { color: #94a3b8; }
.label { font-size: 0.75rem; color: #94a3b8; }
textarea.campo { height: auto; }
</style>

<script>
const $ = id => document.getElementById(id);

function formatarData(valor) {
  if (!valor) return '';
  const [data, hora] = valor.split('T');
  const [ano, mes, dia] = data.split('-');
  return `${dia}/${mes}/${ano} ${hora}`;
}

function toggleParcial() {
  $('reportParcial').classList.toggle('hidden', $('reportTipo').value !== 'Parcial');
  if ($('reportTipo').value !== 'Parcial') $('reportParcial').value = '';
  gerarTexto();
}

function setNA() {
  $('termino').value = '';
  $('termino').dataset.na = 'true';
  gerarTexto();
}

function valorTermino() {
  return $('termino').dataset.na === 'true'
    ? 'N/A'
    : formatarData($('termino').value);
}

function gerarTexto() {
  const tipo = $('reportTipo').value;
  const parcial = $('reportParcial').value;
  const report = tipo === 'Parcial' && parcial ? `Parcial ${parcial}` : tipo;

  const evolucao = $('statuslog').value.trim();

  $('reportTexto').value =
`*Report:* ${report}
*Cliente:* ${$('cliente').value}
*Escalado por:* ${$('escalado').value}
*Motivo:* ${$('motivo').value}
*Chamado:* ${$('chamado').value}
*Início da Crise:* ${formatarData($('inicio').value)}
*Término da Crise:* ${valorTermino()}
*Sala de Crise:* ${$('sala').value}
*Status (Evolução 1h):*
${evolucao}
*Envolvido by Seven:* ${$('by7').value}
*Envolvidos Cliente:* ${$('clienteEnv').value}
*Moderador:* ${$('moderador').value}
*Acionamento via:* ${$('acionamento').value}`;
}

function copiarTexto() {
  $('reportTexto').select();
  document.execCommand('copy');
}

function resetarCampos() {
  document.querySelectorAll('input, textarea, select').forEach(el => {
    el.value = '';
    el.dataset.na = '';
  });

  $('reportTipo').value = 'Inicial';
  $('reportParcial').classList.add('hidden');
  $('reportTexto').value = '';
}

document.querySelectorAll('input, textarea, select')
  .forEach(el => el.addEventListener('input', gerarTexto));
</script>

</body>
</html>
