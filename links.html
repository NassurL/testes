<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Checklist Link</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:15px;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    max-width:1400px;
    margin:auto;
}

.card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
}

h3{
    margin-bottom:12px;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.campo{
    display:flex;
    flex-direction:column;
}

.full{
    grid-column:1 / -1;
}

label{
    font-size:12px;
    font-weight:bold;
    margin-bottom:3px;
}

input,
textarea{
    padding:6px 8px;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:13px;
}

textarea{
    resize:vertical;
    min-height:40px;
}

#alerta{
    height:50px;
}

.preview{
    width:100%;
    height:380px;
    font-family:Consolas, monospace;
    white-space:pre-wrap;
}

.botoes{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.copy-btn{
    flex:1;
    padding:10px;
    border:none;
    border-radius:4px;
    background:#28a745;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.copy-btn:hover{
    background:#218838;
}

.clear-btn{
    flex:1;
    padding:10px;
    border:none;
    border-radius:4px;
    background:#dc3545;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.clear-btn:hover{
    background:#c82333;
}
</style>
</head>

<body>

<div class="container">

    <!-- FORMULÁRIO -->
    <div class="card">
        <h3>📡 Checklist Link</h3>

        <div class="grid">

            <div class="campo">
                <label>Operadora</label>
                <input id="operadora" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Telefone</label>
                <input id="telefone" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Razão Social</label>
                <input id="razao" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>CNPJ</label>
                <input id="cnpj" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Circuito</label>
                <input id="circuito" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Chamado</label>
                <input id="chamado" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Nome Atendente</label>
                <input id="atendente" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Data/Hora Alerta</label>
                <input type="datetime-local" id="datahora" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Protocolo Ligação</label>
                <input id="protLigacao" oninput="gerarTexto()">
            </div>

            <div class="campo">
                <label>Protocolo Reparo</label>
                <input id="protReparo" oninput="gerarTexto()">
            </div>

            <div class="campo full">
                <label>Endereço</label>
                <input id="endereco" oninput="gerarTexto()">
            </div>

            <div class="campo full">
                <label>Alerta</label>
                <textarea id="alerta" oninput="gerarTexto()"></textarea>
            </div>
			
			<div class="campo full">
				<label>SLA</label>
				<input id="sla" oninput="gerarTexto()">
		</div>

        </div>
    </div>

    <!-- PREVIEW -->
    <div class="card">
        <h3>📋 Texto para Chamado</h3>

        <textarea id="preview" class="preview" readonly></textarea>

        <div class="botoes">
            <button class="copy-btn" onclick="copiarTexto()">
                ✓ Copiar
            </button>

            <button class="clear-btn" onclick="limparFormulario()">
                ✕ Limpar Texto
            </button>
        </div>

    </div>

</div>

<script>
function valor(id){
    return document.getElementById(id).value;
}

function gerarTexto(){

    const dataHora = valor("datahora");

    let dataFormatada = "";

    if(dataHora){
        const [data, hora] = dataHora.split("T");
        const [ano, mes, dia] = data.split("-");

        dataFormatada = `${dia}/${mes}/${ano} ${hora}`;
    }

    document.getElementById("preview").value =
`Operadora: ${valor("operadora")}
Telefone: ${valor("telefone")}
Alerta: ${valor("alerta")}
Razão Social: ${valor("razao")}
CNPJ: ${valor("cnpj")}
Endereço: ${valor("endereco")}
Circuito: ${valor("circuito")}
Nome atendente: ${valor("atendente")}
Protocolo de ligação: ${valor("protLigacao")}
Protocolo reparo: ${valor("protReparo")}
Chamado: ${valor("chamado")}
Data/hora alerta: ${dataFormatada}
SLA: ${valor("sla")}`;
}

function copiarTexto(){
    navigator.clipboard.writeText(
        document.getElementById("preview").value
    );

    alert("Texto copiado!");
}

function limparFormulario(){

    document.querySelectorAll("input, textarea").forEach(campo => {
        if(campo.id !== "preview"){
            campo.value = "";
        }
    });

    gerarTexto();
}

gerarTexto();
</script>

</body>
</html>
